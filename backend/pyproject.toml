[project]
name = "pfa-backend"
version = "0.1.0"
description = "Patient Feedback Voice Agent — backend (API, workers, agent runtime)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-celery>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28",
    "sentry-sdk[fastapi]>=2.17",
    "pybreaker>=1.2",
    "phonenumbers>=8.13",
    "uuid6>=2024.7.10",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "cryptography>=43.0",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "zxcvbn>=4.4.28",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "testcontainers[postgres,redis]>=4.8",
    "import-linter>=2.1",
    "types-pyyaml",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC"]
# B008: FastAPI's own idiomatic pattern is `param: T = Depends(...)` — bugbear's "no function
# calls in argument defaults" rule exists for mutable-default-style bugs, not applicable here.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = [
    "phonenumbers.*",
    "pybreaker.*",
    "uuid6.*",
    "celery.*",
    "kombu.*",
    "testcontainers.*",
    "zxcvbn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/alembic/*"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Domain is pure — no adapters, no vendor SDKs"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.adapters.plivo",
    "app.adapters.deepgram",
    "app.adapters.gemini",
    "app.adapters.cartesia",
    "app.adapters.email",
    "app.adapters.storage",
    "app.services",
    "app.api",
    "app.db",
    "app.workers",
    "app.agent",
]

[[tool.importlinter.contracts]]
name = "Services depend on adapter interfaces/fakes only, never vendor SDKs"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = [
    "app.adapters.plivo",
    "app.adapters.deepgram",
    "app.adapters.gemini",
    "app.adapters.cartesia",
    "app.adapters.email",
    "app.adapters.storage",
]
