repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/app/
        additional_dependencies: [pydantic>=2.9, types-pyyaml]
        args: [--config-file=backend/pyproject.toml]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (domain/services never import vendor adapters)
        entry: bash -c 'cd backend && lint-imports'
        language: system
        files: ^backend/app/
        pass_filenames: false
