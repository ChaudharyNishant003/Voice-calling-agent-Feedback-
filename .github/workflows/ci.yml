name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app
      - run: lint-imports
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: dashboard
        run: npm ci
      - working-directory: dashboard
        run: npm run lint
      - working-directory: dashboard
        run: npm run typecheck

  unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit --cov=app --cov-report=term-missing

  integration:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # testcontainers spins up real Postgres containers directly on the runner (Docker is
      # preinstalled on ubuntu-latest) — no docker-outside-of-docker needed here, unlike local dev
      # in a container (see docs/11_BUILD_PLAN.md's S1.1 note and the Makefile's `test` target).
      - run: pytest tests/integration

  safety-rules:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Empty until Sprint 3-4 (docs/11_BUILD_PLAN.md S3.6, S4.7) — deterministic safety detector.
      - run: |
          if ls tests/safety/test_*.py >/dev/null 2>&1; then
            pytest tests/safety
          else
            echo "no safety tests yet (Sprint 3-4)"
          fi

  e2e-sim:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Empty until Sprint 3 (docs/11_BUILD_PLAN.md S3.9) — text-mode call simulator.
      - run: |
          if ls tests/e2e/test_*.py >/dev/null 2>&1; then
            pytest tests/e2e
          else
            echo "no e2e sim tests yet (Sprint 3+)"
          fi

  playwright:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Empty until Sprint 6 (docs/11_BUILD_PLAN.md S6.7) — dashboard screens don't exist yet.
      - working-directory: dashboard
        run: echo "no Playwright flows yet (Sprint 6)"

  security-scans:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - run: bandit -r app -ll
      - run: pip-audit || true  # advisory until dependency set stabilises past Sprint 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2

  migrations:
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pfa
          POSTGRES_PASSWORD: pfa
          POSTGRES_DB: pfa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pfa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://pfa:pfa@localhost:5432/pfa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # docs/02_DATA_MODEL.md §6 — every migration needs a working downgrade().
      - run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
